<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tarkov Loot Checker｜タルコフのフリマ価格とKappa・タスク必要アイテム検索</title>
  <meta name="description" content="Escape from Tarkov のアイテムを名前で検索して、フリマ価格、1マスあたりの価値、Kappa・タスク・ハイドアウトで必要かどうかをすぐ確認できます。PvP・PvE・シーズン対応。">
  <meta name="theme-color" content="#101211">
  <meta property="og:title" content="Tarkov Loot Checker">
  <meta property="og:description" content="タルコフのアイテムを持ち帰るか売るか、数秒で判断。フリマ価格とKappa・タスク・ハイドアウト必要数を表示。">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://tarkov-loot-checker.com/">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23c8b273'/%3E%3Cpath d='M9 9h14v4h-5v10h-4V13H9z' fill='%23101211'/%3E%3C/svg%3E">
  <link rel="alternate" hreflang="ja" href="https://tarkov-loot-checker.com/?lang=ja">
  <link rel="alternate" hreflang="en" href="https://tarkov-loot-checker.com/?lang=en">
  <link rel="alternate" hreflang="x-default" href="https://tarkov-loot-checker.com/">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <header class="top">
    <div class="wrap top-inner">
      <a class="logo" href="./" aria-label="Tarkov Loot Checker"><i class="mark" aria-hidden="true">T</i><b>Tarkov <span>Loot Checker</span></b></a>
      <div class="top-right">
        <nav class="modes" role="tablist" aria-label="ゲームモード" data-i18n-attr="aria-label:modesLabel">
          <button class="mode" data-mode="regular" role="tab">PvP</button>
          <button class="mode" data-mode="pve" role="tab">PvE</button>
          <button class="mode" data-mode="season" role="tab" disabled data-i18n="season">シーズン</button>
        </nav>
        <button id="lang" class="lang" type="button" lang="en">English</button>
      </div>
    </div>
  </header>

  <div class="searchbar">
    <div class="wrap">
      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="アイテム名・略称で検索（例: グラフィック、gpu、ledx）" data-i18n-attr="placeholder:placeholder,aria-label:placeholder" autocomplete="off" spellcheck="false" enterkeyhint="search">
        <kbd title="/ キーでいつでも検索欄に移動" data-i18n-attr="title:kbd">/</kbd>
      </label>
      <div class="controls">
        <div class="chips" role="group" aria-label="絞り込み" data-i18n-attr="aria-label:filtersLabel">
          <button class="chip" data-filter="all" data-i18n="all">すべて</button>
          <button class="chip kappa" data-filter="kappa">Kappa</button>
          <button class="chip task" data-filter="task" data-i18n="task">タスク</button>
          <button class="chip hideout" data-filter="hideout" data-i18n="hideout">ハイドアウト</button>
        </div>
        <label class="sort"><span data-i18n="sortLabel">並び順</span>
          <select id="sort">
            <option value="auto" data-i18n="sortAuto">おすすめ</option>
            <option value="slot" data-i18n="sortSlot">1マスの価値</option>
            <option value="price" data-i18n="sortPrice">売値</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <main class="wrap">
    <div id="notice" class="notice" hidden></div>
    <p id="meta" class="meta" data-i18n="loading">データを読み込み中…</p>
    <ul id="list" class="list"></ul>
    <p id="more" class="more" hidden></p>
  </main>

  <footer class="wrap footer">
    <p id="foot-data">価格・タスク・ハイドアウトのデータ: <a href="https://tarkov.dev" target="_blank" rel="noopener">tarkov.dev</a>（5分ごとに自動更新）</p>
    <p data-i18n="footFan">本サイトは非公式のファンサイトで、Battlestate Games とは関係ありません。</p>
  </footer>

  <script src="app.js?v=4"></script>
</body>
</html>
