<!-- title: Contact -->
<!-- description: How to report bugs or send requests to Tarkov Loot Checker. -->
<h1>Contact</h1>
<p class="lead">Report bugs, wrong data or feature requests here.</p>
<p><a class="cta" data-contact href="https://github.com/lr0uv/tarkov-loot-checker/issues" target="_blank" rel="noopener">Open the contact form</a></p>
<ul>
  <li>For bugs, please include the item name, game mode (PvP, PvE or Season), and your device and browser.</li>
  <li>Prices and quest data come from tarkov.dev automatically. If something differs from the game, let us know.</li>
</ul>
