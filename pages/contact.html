<h1>お問い合わせ</h1>
<p class="lead">不具合の報告、データの誤り、機能のご要望などは、次の窓口からお送りください。</p>
<p><a class="cta" data-contact href="https://github.com/lr0uv/tarkov-loot-checker/issues" target="_blank" rel="noopener">お問い合わせ窓口を開く</a></p>
<h2>お送りいただくときのお願い</h2>
<ul>
  <li>不具合の場合は、アイテム名、ゲームモード（PvP・PvE・シーズン）、お使いの端末とブラウザを書いていただけると、早く直せます。</li>
  <li>価格やタスクのデータは tarkov.dev のデータを自動で表示しています。ゲーム内と違う場合は、その旨をお知らせください。</li>
  <li>お返事までにお時間をいただくことがあります。</li>
</ul>
