name: ETL Micro-batch Test

on:
  workflow_dispatch:

jobs:
  test-fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Test Tarkov.dev API
        run: |
          echo "Tarkov.devから5件だけデータを要求します..."
          HTTP_STATUS=$(curl -s -o response.txt -w "%{http_code}" -X POST https://api.tarkov.dev/graphql -H "Content-Type: application/json" -H "Accept: application/json" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -d '{"query": "{ items(limit: 5, lang: ja) { id name shortName } }"}')
          echo "HTTPステータスコード: $HTTP_STATUS"
          echo "--- レスポンスの中身 ---"
          cat response.txt
