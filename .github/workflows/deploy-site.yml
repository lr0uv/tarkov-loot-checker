name: Deploy site

# サーバーに置くファイル一式（検索ページ・ガイド・アイテムごとのページ）を組み立てて、
# シンレンタルサーバーの public_html に自動でアップロードする。
#   - main に site/・pages/・組み立てスクリプトの変更が入ったとき
#   - 毎日1回（新しいアイテムや、PvE/PvP価格差のページを反映するため）
# アップロードは前回から変わったファイルだけを送る（サーバー上の .ftp-deploy-sync-state.json で管理）。
# 使うには、GitHub の Settings → Secrets and variables → Actions に次の3つを登録する：
#   FTP_SERVER   FTPサーバー（ホスト）名
#   FTP_USERNAME public_html 専用に作ったFTPアカウント名
#   FTP_PASSWORD そのFTPアカウントのパスワード
on:
  push:
    branches: [main]
    paths: ['site/**', 'pages/**', 'scripts/build-pages.mjs', '.github/workflows/deploy-site.yml']
  schedule:
    - cron: '0 18 * * *' # 毎日 03:00（日本時間）
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # 初回はアイテムページを数千ファイル送るので長めにしておく
    timeout-minutes: 120
    steps:
      - name: Check FTP settings
        id: check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "FTPの設定（Secrets）がまだ登録されていないので、アップロードを飛ばします。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 20

      # データが取れなければここで失敗して止まる（空のままアップロードしてページを消さないため）
      - name: Build pages
        if: steps.check.outputs.ready == 'true'
        run: node scripts/build-pages.mjs dist

      # 1万ファイル近くあるので、1本の接続で順番に送ると途中で接続が切れる（2026-10-19に51分でタイムアウト）。
      # lftp で8本同時に送り、切れても自動でつなぎ直す。
      # 前回送ったファイルの指紋（ハッシュ）をサーバーの .deploy-manifest.txt に残し、変わったファイルだけ送る。
      - name: Install lftp
        if: steps.check.outputs.ready == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Upload changed files to the server
        if: steps.check.outputs.ready == 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          cat > lftp.rc <<'RC'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate yes
          set net:timeout 30
          set net:max-retries 8
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 60
          set cmd:fail-exit true
          RC
          # パスワードは環境変数で渡す（記号を含んでいても壊れないように）
          export LFTP_PASSWORD="$FTP_PASSWORD"
          ftp() { lftp -u "$FTP_USERNAME" --env-password -e "source lftp.rc; $1; bye" "$FTP_SERVER"; }

          # 前回の記録を取ってくる（初回はないので空）
          ftp "get -O . .deploy-manifest.txt" || : > .deploy-manifest.txt
          (cd dist && find . -type f | sort | xargs sha1sum) > new-manifest.txt

          # 指紋が前回と違うファイルだけを staging/ に集める
          rm -rf staging && mkdir staging
          comm -13 <(sort .deploy-manifest.txt) <(sort new-manifest.txt) | awk '{print $2}' > changed.txt
          echo "変わったファイル: $(wc -l < changed.txt) / 全体: $(wc -l < new-manifest.txt)"
          if [ -s changed.txt ]; then (cd dist && xargs -a ../changed.txt cp --parents -t ../staging); fi

          # トップページ（index.html）は最後に送る。先に送ると、新しいページが古いJSを読んで壊れることがあるため
          mkdir -p last
          if [ -f staging/index.html ]; then mv staging/index.html last/; fi
          if [ -n "$(ls -A staging)" ]; then ftp "mirror -R --parallel=8 --no-perms --verbose=0 staging ./"; fi
          if [ -f last/index.html ]; then ftp "put -O . last/index.html"; fi

          # 全部送れたときだけ記録を更新する（途中で失敗したら、次回また送り直す）
          cp new-manifest.txt .deploy-manifest.txt
          ftp "put -O . .deploy-manifest.txt"
